<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="4" />

  <!-- Automaton State Nodes & Transitions Graphic -->
  <g transform="translate(40, 56)">
    <!-- Node A (Source) -->
    <circle cx="90" cy="200" r="48" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="6" />
    <text x="90" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#e0e7ff" text-anchor="middle">A</text>

    <!-- Transition Arc A -> B -->
    <path d="M 136 185 Q 216 120 296 185" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />
    <polygon points="298,185 282,175 288,193" fill="#fb923c" />
    <!-- Terminal label -->
    <rect x="196" y="118" width="40" height="30" rx="8" fill="#0f172a" stroke="rgba(249,115,22,0.4)" stroke-width="2" />
    <text x="216" y="140" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="20" fill="#fb923c" text-anchor="middle">a</text>

    <!-- Reverse Arc B -> A -->
    <path d="M 296 215 Q 216 280 136 215" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round" opacity="0.8" />
    <polygon points="134,215 150,225 144,207" fill="#818cf8" />

    <!-- Node B (Final State / Target) -->
    <circle cx="342" cy="200" r="54" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="6" filter="url(#glow)" />
    <circle cx="342" cy="200" r="44" fill="none" stroke="#34d399" stroke-width="4" />
    <text x="342" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#e0e7ff" text-anchor="middle">B</text>

    <!-- Formula Subtitle Badge -->
    <rect x="52" y="306" width="328" height="52" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
    <text x="216" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">
      LLG <tspan fill="#818cf8">⇄</tspan> RLG
    </text>
  </g>
</svg>
